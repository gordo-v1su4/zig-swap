<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zig Swap — v0 PGM shell</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #050608;
        color: #e2e8f0;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }
      main {
        width: min(960px, 100%);
        display: grid;
        gap: 1rem;
      }
      canvas {
        width: 100%;
        aspect-ratio: 16 / 9;
        border: 1px solid #1e293b;
        border-radius: 8px;
        background: #0b0d12;
      }
      pre {
        margin: 0;
        padding: 1rem;
        background: #0f172a;
        border-radius: 8px;
        overflow: auto;
        font-size: 12px;
      }
      #status {
        margin: 0;
        color: #94a3b8;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Zig Swap v0</h1>
      <p id="status">Loading…</p>
      <canvas id="pgm" width="1280" height="720"></canvas>
      <pre id="frame">{}</pre>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
